name: Feature request
description: Suggest a focused, publicly discussable improvement.
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Do not include credentials, buyer data, or
        account-specific production details. Security reports belong in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user or integrator problem, not only a proposed API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Explain the contract, behavior, and expected compatibility impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Security boundary
      options:
        - label: The proposal keeps trusted catalog data, payment credentials, and buyer data outside model-controlled input.
          required: true

